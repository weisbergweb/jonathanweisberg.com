<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jonathan Weisberg is a Front End Web Developer building fast, precise, accessible and thoughtfully crafted interfaces for the web.">
    <title>Jonathan Weisberg — Front End Web Developer</title>

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap">

    <style>
      /* Reset */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      /* Base */
      body {
        background: #F7F5F1;
        color: #1C1B19;
        font-family: 'DM Sans', sans-serif;
        font-weight: 300;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:hover {
        color: #BB4B49;
      }

      /* Layout */
      .page-wrapper {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Main */
      .site-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 0 60px 80px;
        max-width: 1100px;
        margin: 0 auto;
        width: 100%;
      }

      .site-logo {
        display: block;
        margin-top: 15px;
        margin-bottom: 40px;
      }

      .site-role {
        margin-bottom: 28px;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #BB4B49;
        font-family: 'DM Sans', sans-serif;
        font-weight: 400;
      }

      .site-name {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 300;
        font-size: clamp(64px, 9vw, 128px);
        line-height: 0.95;
        letter-spacing: -0.02em;
        color: #1C1B19;
        text-wrap: pretty;
      }

      .site-name em {
        font-style: italic;
        color: #BB4B49;
      }

      .site-tagline {
        margin-top: 48px;
        max-width: 420px;
      }

      .site-tagline p {
        font-size: 17px;
        line-height: 1.7;
        color: #6B6A66;
        font-weight: 300;
      }

      .site-cta {
        margin-top: 56px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
      }

      .btn-outline {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #C8C6C0;
        color: #6B6A66;
        font-size: 13px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 14px 28px;
        transition: border-color 0.2s, color 0.2s;
      }

      .btn-outline:hover {
        border-color: #BB4B49;
        color: #BB4B49;
      }

      /* Footer */
      .site-footer {
        border-top: 1px solid #E4E2DC;
        padding: 28px 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
      }

      .skills-list {
        display: flex;
        gap: 32px;
        flex-wrap: wrap;
        list-style: none;
      }

      .skills-list li {
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #A8A69F;
      }

      .site-copyright {
        font-size: 12px;
        color: #C8C6C0;
        letter-spacing: 0.06em;
      }

      /* Animations */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      .a1 { animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .a2 { animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both; }
      .a3 { animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both; }
      .a4 { animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.42s both; }
      .a5 { animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.56s both; }
      .logo-anim { animation: fadeIn 1s cubic-bezier(0.22, 1, 0.36, 1) both; }

      @media (prefers-reduced-motion: reduce) {
        .a1, .a2, .a3, .a4, .a5, .logo-anim { animation: none; }
      }
    </style>
  </head>

  <body>
    <div class="page-wrapper">

      <main class="site-main">
        <img
          src="assets/WeisbergWeb-Logo-med650.png"
          alt="WeisbergWeb logo"
          width="96"
          height="96"
          class="site-logo logo-anim"
        >

        <p class="site-role a2">Front End Web Developer</p>

        <h1 class="site-name a3">
          Jonathan<br>
          <em>Weisberg</em>
        </h1>

        <div class="site-tagline a4">
          <p>Building fast, precise, accessible and thoughtfully crafted interfaces for the web.</p>
        </div>

        <div class="site-cta a5">
          <a href="mailto:jonathan@weisbergweb.com" class="btn-outline">
            Get in Touch
          </a>
        </div>
      </main>

      <footer class="site-footer a5">
        <nav aria-label="Skills">
          <ul class="skills-list">
            <li>HTML &amp; CSS</li>
            <li>JavaScript</li>
            <li>Angular</li>
            <li>React</li>
            <li>TypeScript</li>
            <li>Web Performance</li>
          </ul>
        </nav>
        <span class="site-copyright">© 2026 Jonathan Weisberg</span>
      </footer>

    </div>
  </body>
</html>
